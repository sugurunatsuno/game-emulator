name: Bug report
description: Report a reproducible launcher, installer, or runtime problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Hako. Remove account names and other personal data from logs before attaching them.
  - type: input
    id: launcher-version
    attributes:
      label: Hako version and build
      placeholder: 1.2.4 (53)
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: 15.6.1
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac model and Apple chip
      placeholder: MacBook Pro, Apple M3 Pro
    validations:
      required: true
  - type: dropdown
    id: installation-state
    attributes:
      label: Installation state
      options:
        - Fresh installation
        - Updated installation
        - Existing installation
    validations:
      required: true
  - type: input
    id: resolution
    attributes:
      label: Selected resolution
      placeholder: 1920×1080
    validations:
      required: true
  - type: input
    id: resources
    attributes:
      label: Selected RAM and vCPU
      placeholder: 6144 MB RAM, 6 vCPU
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste relevant log excerpts. Remove account names, filesystem usernames, tokens, device identifiers, and other private data.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, account identifiers, and raw sensitive logs from this report.
          required: true
